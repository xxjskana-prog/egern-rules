# Egern 模块 Env 填写示例：
# 名称: PROVINCE       值: 51（省份名称或行政代码；必填）
# 名称: CITY           值: 成都（城市或显示地区；必填）
# 名称: AREA_INDEX     值: 0（多价区索引，从 0 开始；可选）
# 名称: REFRESH_MINUTES 值: 30（刷新间隔，单位为分钟；可选）
# 名称: REQUEST_TIMEOUT 值: 15000（请求超时，单位为毫秒；可选）
name: "油价小组件"
description: "显示自选地区油价、预测及调价时间，使用 iOS 系统磨砂背景。Env 示例：名称 PROVINCE，值 51；名称 CITY，值 成都。"
author: "xxjskana-prog"

scriptings:
  - generic:
      name: "oil-price-widget"
      script_url: "https://raw.githubusercontent.com/xxjskana-prog/egern-rules/main/widgets/oil-price-widget/oil-price-widget.js"
      timeout: 20

widgets:
  - name: "油价小组件"
    script_name: "oil-price-widget"
