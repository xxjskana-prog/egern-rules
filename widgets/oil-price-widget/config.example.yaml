# 手动导入 oil-price-widget.js 作为 generic 脚本后，
# 或安装 module.yaml，再在主配置的 widgets 字段中加入以下内容。

widgets:
  - name: "油价小组件"
    script_name: "oil-price-widget"
    env:
      # 支持省份名称或代码，例如 "上海" 或 "31"。
      PROVINCE: "51"
      CITY: "成都"
      # 多价区省份可取消注释并修改索引，索引从 0 开始。
      # AREA_INDEX: "0"
      REFRESH_MINUTES: "30"
      REQUEST_TIMEOUT: "15000"
